<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGA - Control de Asistencias</title>
    <style>
        :root {
            --ink: #1f2933;
            --muted: #667085;
            --surface: #ffffff;
            --canvas: #eef2f5;
            --line: #dfe5ea;
            --primary: #176b87;
            --primary-hover: #10566d;
            --danger: #b42318;
            --danger-hover: #912018;
            --success: #18794e;
            --warning: #b54708;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--canvas); color: var(--ink); }
        main-menu { display: block; max-width: 1180px; margin: 0 auto; padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
        .header h1 { margin: 0; font-size: clamp(1.35rem, 2.5vw, 2rem); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .card { background: var(--surface); padding: 20px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 5px 18px rgba(31, 41, 51, 0.06); }
        h1, h2, h3 { margin-top: 0; color: var(--ink); }
        .card h3 { font-size: 1.05rem; }
        .card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        button { min-height: 40px; padding: 9px 14px; cursor: pointer; border: 1px solid transparent; border-radius: 6px; background: var(--primary); color: white; font-weight: 600; transition: background 0.18s, border-color 0.18s, transform 0.18s; }
        button:hover { background: var(--primary-hover); }
        button:active { transform: translateY(1px); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(23, 107, 135, 0.24); outline-offset: 2px; }
        button.danger { background: var(--danger); }
        button.danger:hover { background: var(--danger-hover); }
        .notification-region { position: fixed; top: 18px; right: 18px; z-index: 1000; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); }
        .notification { border: 1px solid var(--line); border-left: 5px solid var(--primary); border-radius: 8px; padding: 12px 14px; background: white; box-shadow: 0 12px 30px rgba(31, 41, 51, 0.16); font-size: 14px; }
        .notification.success { border-left-color: var(--success); }
        .notification.error { border-left-color: var(--danger); }
        .notification.warning { border-left-color: var(--warning); }
        .notification strong { display: block; margin-bottom: 2px; }
        .empty-state { padding: 24px; border: 1px dashed #bcc7d0; border-radius: 8px; color: var(--muted); text-align: center; }
        dialog.attendance-modal { width: min(980px, 94vw); }
        .attendance-toolbar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; margin-bottom: 16px; }
        .attendance-context { min-width: 0; }
        .attendance-context strong { display: block; font-size: 1.05rem; }
        .attendance-context span { color: var(--muted); font-size: 13px; }
        .attendance-summary { display: grid; grid-template-columns: repeat(4, minmax(72px, 1fr)); gap: 8px; }
        .summary-item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: #f8fafb; }
        .summary-item span { display: block; color: var(--muted); font-size: 12px; }
        .summary-item strong { display: block; margin-top: 2px; font-size: 1.25rem; }
        .attendance-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .attendance-actions button { min-height: 36px; background: #eaf3f6; color: var(--primary); border-color: #bad8e2; }
        .attendance-row { display: grid; grid-template-columns: minmax(180px, 1fr) repeat(4, 92px); align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
        .attendance-row.header-row { position: sticky; top: 0; z-index: 1; border-bottom: 2px solid #b8c4cc; background: #f5f7f8; font-size: 12px; font-weight: 700; }
        .attendance-student strong { display: block; }
        .attendance-student span { color: var(--muted); font-size: 12px; }
        .status-options { display: grid; grid-template-columns: repeat(4, 92px); gap: 8px; }
        .status-option input { position: absolute; opacity: 0; pointer-events: none; }
        .status-option span { display: grid; min-height: 36px; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; }
        .status-option input:checked + span { border-color: var(--primary); background: var(--primary); color: white; }
        .status-option input[value="absent"]:checked + span { border-color: var(--danger); background: var(--danger); }
        .status-option input[value="late"]:checked + span { border-color: var(--warning); background: var(--warning); }
        .early-option input:checked + span { border-color: #7a5af8; background: #7a5af8; color: white; }
        .attendance-dirty { color: var(--warning); }

        @media (max-width: 800px) {
            #attendanceReportTable.report-table-wrap {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }
            #attendanceReportTable .report-desktop { display: none; }
            #attendanceReportTable .report-mobile { display: grid; gap: 10px; }
            #attendanceReportCard { padding: 14px; }
        }

        @media (max-width: 640px) {
            main-menu { padding: 14px; }
            .header { align-items: flex-start; flex-direction: column; }
            .header h1 { font-size: 1.35rem; }
            .header-actions { width: 100%; flex-wrap: wrap; }
            .header-actions button { flex: 1 1 140px; }
            .card { padding: 16px; }
            .card-actions { display: grid; grid-template-columns: 1fr; }
            .card-actions button { width: 100%; margin: 0; }
            .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; }
            .attendance-toolbar { grid-template-columns: 1fr; }
            .attendance-summary { grid-template-columns: repeat(2, 1fr); }
            .attendance-row { grid-template-columns: 1fr auto; padding: 12px 8px; }
            .attendance-row.header-row { display: none; }
            .status-options { grid-column: 1 / -1; grid-template-columns: repeat(4, 1fr); }
            .status-option span { min-height: 42px; }
            .attendance-actions button { flex: 1 1 130px; }
        }

        dialog { border: none; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 25px; width: 440px; max-width: 90%; }
        dialog.attendance-modal { width: 760px; max-height: 85vh; }
        dialog::backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .dialog-actions button.cancel { background: #95a5a6; }
        .attendance-table-wrap { max-height: 60vh; overflow: auto; }
        .attendance-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .attendance-table th, .attendance-table td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        .attendance-table th { position: sticky; top: 0; background: white; }
        .attendance-table select { padding: 6px; }
        .attendance-table input[type="checkbox"] { width: 18px; height: 18px; }
        .report-table-wrap { overflow-x: auto; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        .report-table th, .report-table td { padding: 8px 10px; border: 1px solid #dfe6e9; text-align: center; }
        .report-table th { background: #ecf0f1; color: #2c3e50; }
        .report-table th:first-child, .report-table td:first-child { text-align: left; position: sticky; left: 0; background: white; }
        .report-table th:first-child { background: #ecf0f1; }
        .report-table .report-empty { color: #7f8c8d; }
        .attendance-date-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
        .attendance-mobile-item { width: 100%; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
        .attendance-mobile-item header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .attendance-mobile-item h4 { margin: 0; font-size: 15px; }
        .attendance-mobile-item .percentage { color: var(--primary); font-size: 18px; font-weight: 800; }
        .mobile-attendance-statuses { min-width: 0; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
        .mobile-status { border-radius: 6px; padding: 7px 4px; background: #f5f7f8; text-align: center; }
        .mobile-status span { display: block; color: var(--muted); font-size: 11px; }
        .mobile-status strong { font-size: 16px; }
        .mobile-session-list { min-width: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
        .mobile-session { border: 1px solid var(--line); border-radius: 6px; padding: 7px 5px; text-align: center; }
        .mobile-session span { display: block; color: var(--muted); font-size: 10px; }
        .mobile-session strong { display: block; margin-top: 3px; }
        .report-mobile-legend { color: var(--muted); font-size: 12px; }

        #attendanceReportTable .report-desktop { display: table; }
        #attendanceReportTable .report-mobile { display: none; }
        @media (max-width: 800px) {
            #attendanceReportTable.report-table-wrap {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }
            #attendanceReportTable .report-desktop { display: none; }
            #attendanceReportTable .report-mobile { display: grid; gap: 10px; }
        }
    </style>
</head>
<body></body>
    <script>
        const host = 'http://localhost:3000';
        let currentUserId = null;
        let authSessionToken = null;

        function notify(message, type = 'success', title = 'Información') {
            const region = document.getElementById('notificationRegion');
            if (!region) return;
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            const heading = document.createElement('strong');
            heading.textContent = title;
            notification.append(heading, document.createTextNode(message));
            region.appendChild(notification);
            window.setTimeout(function () {
                notification.remove();
            }, 5000);
        }

        window.alert = function (message) {
            notify(String(message).replace(/^Error:\s*/, ''), 'error', 'No se pudo completar');
        };

        class RPCWebAPIException extends Error {
            constructor(type, detail) {
                super(detail);
                this.name = 'RPCWebAPIException';
                this.type = type;
                this.detail = detail;
            }
        }

        async function computeSHA256(plainText) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(function (byte) { return byte.toString(16).padStart(2, '0'); })
                .join('');
        }

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'x-user-id': currentUserId,
                'Authorization': `Bearer ${authSessionToken}`,
                'x-api-version': '1.0'
            };
        }
        async function rpcFetch(path, body = {}) {
            const response = await fetch(host + path, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(body)
            });

            if (response.status === 200) return response.json();
                if (response.status === 400) throw new RPCWebAPIException('BadRequest', 'Error en los datos enviados');
                if (response.status === 401 || response.status === 403) {
                authSessionToken = null;
                throw new RPCWebAPIException('AuthError', 'No autorizado o sesión expirada');
            }
            if (response.status === 422) {
                const err = await response.json().catch(function () { return {}; });
                throw new RPCWebAPIException('DomainError', err.detail ? err.detail[0] : 'Error de validación');
            }
            throw new RPCWebAPIException('ServerError', 'Error interno del servidor');
        }

        function showFormModal(title, fields) {
            return new Promise(function (resolve) {
                const modal = document.getElementById('formModal');
                document.getElementById('modalTitle').textContent = title;
                const modalBody = document.getElementById('modalBody');
                while (modalBody.firstChild) {
                    modalBody.removeChild(modalBody.firstChild);
                }

                const inputs = {};

                fields.forEach(function (f) {
                    const group = document.createElement('div');
                    group.className = 'form-group';
                    
                    const label = document.createElement('label');
                    label.textContent = f.label;
                    group.appendChild(label);

                    let input;
                    if (f.type === 'select') {
                        input = document.createElement('select');
                        f.options.forEach(function (opt) {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            option.textContent = opt.text;
                            input.appendChild(option);
                        });
                    } else {
                        input = document.createElement('input');
                        input.type = f.type || 'text';
                        if (f.placeholder) input.placeholder = f.placeholder;
                    }
                    if (f.value !== undefined) input.value = f.value;
                    
                    inputs[f.name] = input;
                    group.appendChild(input);
                    modalBody.appendChild(group);
                });

                const btnSubmit = document.getElementById('btnSubmitModal');
                const btnCancel = document.getElementById('btnCancelModal');

                const cleanup = function () {
                    btnSubmit.onclick = null;
                    btnCancel.onclick = null;
                    modal.close();
                };

                btnSubmit.onclick = function () {
                    const result = {};
                    fields.forEach(function (f) {
                        result[f.name] = f.type === 'checkbox' ? inputs[f.name].checked : inputs[f.name].value;
                    });
                    cleanup();
                    resolve(result);
                };

                btnCancel.onclick = function () {
                    cleanup();
                    resolve(null);
                };

                modal.showModal();
            });
        }

        function showAttendanceModal(courseName, date, students) {
            return new Promise(function (resolve) {
                const modal = document.getElementById('formModal');
                const modalBody = document.getElementById('modalBody');
                document.getElementById('modalTitle').textContent = 'Tomar asistencia';
                modal.classList.add('attendance-modal');
                while (modalBody.firstChild) modalBody.removeChild(modalBody.firstChild);

                const toolbar = createElement('div', { className: 'attendance-toolbar' });
                const context = createElement('div', { className: 'attendance-context' });
                context.appendChild(createElement('strong', { textContent: courseName }));
                context.appendChild(createElement('span', { textContent: `Clase del ${date.split('-').reverse().join('/')} · ${students.length} estudiantes` }));
                toolbar.appendChild(context);

                const summary = createElement('div', { className: 'attendance-summary' });
                const summaryValues = {
                    present: createElement('strong', { textContent: '0' }),
                    absent: createElement('strong', { textContent: '0' }),
                    late: createElement('strong', { textContent: '0' }),
                    early: createElement('strong', { textContent: '0' })
                };
                [['present', 'Presentes'], ['absent', 'Ausentes'], ['late', 'Tardes'], ['early', 'Retiros']].forEach(function (item) {
                    const summaryItem = createElement('div', { className: 'summary-item' });
                    summaryItem.appendChild(createElement('span', { textContent: item[1] }));
                    summaryItem.appendChild(summaryValues[item[0]]);
                    summary.appendChild(summaryItem);
                });
                toolbar.appendChild(summary);

                const actions = createElement('div', { className: 'attendance-actions' });
                const markPresentButton = createButton('', 'Marcar todos presentes');
                const resetButton = createButton('', 'Restablecer estados');
                actions.append(markPresentButton, resetButton);
                modalBody.append(toolbar, actions);

                const rows = new Map();
                const header = createElement('div', { className: 'attendance-row header-row' });
                ['Estudiante', 'Presente', 'Ausente', 'Tarde', 'Retiro'].forEach(function (label) {
                    header.appendChild(createElement('div', { textContent: label }));
                });
                modalBody.appendChild(header);

                function updateSummary() {
                    const totals = { present: 0, absent: 0, late: 0, early: 0 };
                    rows.forEach(function (row) {
                        const selectedStatus = Object.keys(row.statusRadios).find(function (key) {
                            return row.statusRadios[key].checked;
                        });
                        totals[selectedStatus]++;
                        if (row.early.checked) totals.early++;
                    });
                    Object.keys(totals).forEach(function (key) {
                        summaryValues[key].textContent = totals[key];
                    });
                }

                students.forEach(function (student) {
                    const row = createElement('div', { className: 'attendance-row' });
                    const identity = createElement('div', { className: 'attendance-student' });
                    identity.appendChild(createElement('strong', { textContent: `${student.surname}, ${student.name}` }));
                    identity.appendChild(createElement('span', { textContent: `DNI ${student.dni || '—'}` }));
                    row.appendChild(identity);

                    const statusOptions = createElement('div', { className: 'status-options' });
                    const statusRadios = {};
                    [['present', 'P'], ['absent', 'A'], ['late', 'T']].forEach(function (option) {
                        const label = createElement('label', { className: 'status-option' });
                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `attendance-${student.studentId}`;
                        input.value = option[0];
                        input.checked = (student.attendanceStatus || 'absent') === option[0];
                        input.addEventListener('change', updateSummary);
                        const marker = createElement('span', { textContent: option[1] });
                        statusRadios[option[0]] = input;
                        label.append(input, marker);
                        statusOptions.appendChild(label);
                    });
                    row.appendChild(statusOptions);

                    const earlyLabel = createElement('label', { className: 'status-option early-option' });
                    const early = document.createElement('input');
                    early.type = 'checkbox';
                    early.checked = Boolean(student.earlyDeparture);
                    early.setAttribute('aria-label', `Retiro anticipado de ${student.name} ${student.surname}`);
                    early.addEventListener('change', updateSummary);
                    earlyLabel.append(early, createElement('span', { textContent: 'R' }));
                    statusOptions.appendChild(earlyLabel);
                    modalBody.appendChild(row);
                    rows.set(student.studentId, { statusRadios, early });
                });

                markPresentButton.onclick = function () {
                    rows.forEach(function (row) {
                        row.statusRadios.present.checked = true;
                        row.statusRadios.present.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                };
                resetButton.onclick = function () {
                    rows.forEach(function (row) {
                        row.statusRadios.absent.checked = true;
                        row.early.checked = false;
                    });
                    updateSummary();
                };
                updateSummary();

                const btnSubmit = document.getElementById('btnSubmitModal');
                const btnCancel = document.getElementById('btnCancelModal');
                const cleanup = function () {
                    btnSubmit.onclick = null;
                    btnCancel.onclick = null;
                    modal.classList.remove('attendance-modal');
                    modal.close();
                };
                btnSubmit.onclick = function () {
                    const records = students.map(function (student) {
                        const row = rows.get(student.studentId);
                        const status = Object.keys(row.statusRadios).find(function (key) {
                            return row.statusRadios[key].checked;
                        });
                        return { studentId: student.studentId, status, earlyDeparture: row.early.checked };
                    });
                    cleanup();
                    resolve(records);
                };
                btnCancel.onclick = function () {
                    cleanup();
                    resolve(null);
                };
                modal.showModal();
            });
        }

        const dataLabels = {
            userId: 'Usuario', username: 'Nombre de usuario', role: 'Rol', status: 'Estado',
            studentId: 'Alumno', name: 'Nombre', surname: 'Apellido', dni: 'DNI',
            courseId: 'Curso', professorId: 'Docente', startDate: 'Inicio', endDate: 'Fin',
            academicYear: 'Ciclo lectivo', holidays: 'Feriados', academicCalendarId: 'Calendario',
            success: 'Resultado', message: 'Mensaje', present: 'Presentes', absent: 'Ausentes', late: 'Tardes'
        };

        function formatDataValue(value) {
            if (value === null || value === undefined || value === '') return '—';
            if (typeof value === 'boolean') return value ? 'Sí' : 'No';
            if (typeof value === 'object') return JSON.stringify(value);
            if (value === 'enabled') return 'Habilitado';
            if (value === 'disabled') return 'Deshabilitado';
            return String(value);
        }

        function createDataTable(rows) {
            const wrap = document.createElement('div');
            wrap.className = 'report-table-wrap';
            const table = document.createElement('table');
            table.className = 'report-table';
            const columns = Array.from(new Set(rows.flatMap(function (row) {
                return Object.keys(row || {}).filter(function (key) {
                    if (key.toLowerCase() === 'userid' || key.toLowerCase().includes('id')) return false;
                    return typeof row[key] !== 'object' || row[key] === null;
                });
            })));
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            columns.forEach(function (column) {
                const cell = document.createElement('th');
                cell.textContent = dataLabels[column] || column.replace(/([A-Z])/g, ' $1').replace(/^./, function (letter) {
                    return letter.toUpperCase();
                });
                headerRow.appendChild(cell);
            });
            thead.appendChild(headerRow);
            const tbody = document.createElement('tbody');
            rows.forEach(function (row) {
                const tableRow = document.createElement('tr');
                columns.forEach(function (column) {
                    const cell = document.createElement('td');
                    cell.textContent = formatDataValue(row[column]);
                    tableRow.appendChild(cell);
                });
                tbody.appendChild(tableRow);
            });
            table.append(thead, tbody);
            wrap.appendChild(table);
            return wrap;
        }

        function createElement(tagName, options = {}) {
            const element = document.createElement(tagName);
            if (options.id) element.id = options.id;
            if (options.className) element.className = options.className;
            if (options.textContent) element.textContent = options.textContent;
            if (options.style) element.style.cssText = options.style;
            return element;
        }

        function createButton(id, text, isDanger = false) {
            return createElement('button', {
                id,
                className: isDanger ? 'danger' : '',
                textContent: text
            });
        }

        function createCard(id, title, buttonDefinitions, style = '') {
            const card = createElement('div', { id, className: 'card', style });
            card.appendChild(createElement('h3', { textContent: title }));
            const actions = createElement('div', { className: 'card-actions' });
            buttonDefinitions.forEach(function (definition) {
                actions.appendChild(createButton(definition[0], definition[1], definition[2]));
            });
            card.appendChild(actions);
            return card;
        }

        class Menu extends HTMLElement {
            constructor() {
                super();

                const formModal = createElement('dialog', { id: 'formModal' });
                formModal.appendChild(createElement('h3', { id: 'modalTitle', textContent: 'Título' }));
                formModal.appendChild(createElement('div', { id: 'modalBody' }));
                const dialogActions = createElement('div', { className: 'dialog-actions' });
                dialogActions.appendChild(createButton('btnCancelModal', 'Cancelar'));
                dialogActions.lastChild.classList.add('cancel');
                dialogActions.appendChild(createButton('btnSubmitModal', 'Aceptar'));
                formModal.appendChild(dialogActions);

                const notificationRegion = createElement('div', { id: 'notificationRegion', className: 'notification-region' });
                const header = createElement('div', { className: 'header' });
                header.appendChild(createElement('h1', { textContent: 'Panel de Gestión Académica' }));
                const headerActions = createElement('div');
                headerActions.appendChild(createElement('span', {
                    id: 'userStatus',
                    textContent: 'Desconectado',
                    style: 'margin-right: 15px; font-weight: bold;'
                }));
                headerActions.appendChild(createButton('btnLogin', 'Iniciar Sesión'));
                headerActions.appendChild(createButton('btnLogout', 'Cerrar Sesión', true));
                headerActions.lastChild.style.display = 'none';
                header.appendChild(headerActions);

                const actionContainer = createElement('div', {
                    id: 'actionContainer',
                    style: 'display: none;'
                });
                actionContainer.appendChild(createCard('adminContainer', 'Administración', [
                    ['btnNewUser', 'Agregar Usuario / Rol'],
                    ['btnModifyUser', 'Modificar Usuario'],
                    ['btnDisableUser', 'Deshabilitar Usuario', true],

            printResult(data) {
                const resultCard = document.getElementById('resultCard');
                const resultTitle = document.getElementById('resultTitle');
                const resultContent = document.getElementById('resultContent');
                while (resultContent.firstChild) resultContent.removeChild(resultContent.firstChild);

                const collectionKey = Object.keys(data).find(function (key) {
                    return Array.isArray(data[key]);
                });
                if (collectionKey && data[collectionKey].length > 0) {
                    resultTitle.textContent = collectionKey.charAt(0).toUpperCase() + collectionKey.slice(1);
                    resultContent.appendChild(createDataTable(data[collectionKey]));
                } else if (collectionKey) {
                    resultTitle.textContent = collectionKey.charAt(0).toUpperCase() + collectionKey.slice(1);
                    resultContent.appendChild(createElement('div', {
                        className: 'empty-state',
                        textContent: 'No hay registros para mostrar.'
                    }));
                } else {
                    resultTitle.textContent = data.message || 'Resultado';
                    const fields = Object.entries(data).filter(function (entry) {
                        return entry[0] !== 'message';
                    });
                    if (fields.length === 0) {
                        resultContent.appendChild(createElement('div', {
                            className: 'empty-state',
                            textContent: 'Operación completada correctamente.'
                        }));
                    } else {
                        resultContent.appendChild(createDataTable([Object.fromEntries(fields)]));
                    }
                }
                resultCard.style.display = 'block';
            }

            clearAttendanceReport() {
                const reportCard = document.getElementById('attendanceReportCard');
                const tableContainer = document.getElementById('attendanceReportTable');
                const reportTitle = document.getElementById('attendanceReportTitle');
                while (tableContainer.firstChild) {

            printAttendanceReport(report) {
                const reportCard = document.getElementById('attendanceReportCard');
                const tableContainer = document.getElementById('attendanceReportTable');
                const reportTitle = document.getElementById('attendanceReportTitle');
                while (tableContainer.firstChild) {
                    tableContainer.removeChild(tableContainer.firstChild);
                }
                reportTitle.textContent = `Reporte de asistencia - ${report.course.name}`;
                const table = document.createElement('table');
                table.className = 'report-table report-desktop';
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                const reportHeaders = ['Estudiante'].concat(
                    report.sessions.map(function (session) {
                        return session.date.split('-').reverse().join('/');
                    }),
                    ['Presentes', 'Tardes', 'Ausentes', 'Retiros', 'Asistencia']
                );
                reportHeaders.forEach(function (header) {
                    const cell = document.createElement('th');
                    cell.textContent = header;
                    headerRow.appendChild(cell);
                });
                thead.appendChild(headerRow);
                const tbody = document.createElement('tbody');
                report.students.forEach(function (student) {
                    const row = document.createElement('tr');
                    const nameCell = document.createElement('td');
                    nameCell.textContent = `${student.surname}, ${student.name}`;
                    row.appendChild(nameCell);
                    report.sessions.forEach(function (session) {
                        const cell = document.createElement('td');
                        const record = student.attendanceByDate[session.date];
                        if (!record) {
                            cell.textContent = '-';
                            cell.className = 'report-empty';
                        } else {
                            const status = { present: 'P', late: 'T', absent: 'A' }[record.status] || '-';
                            cell.textContent = record.earlyDeparture ? `${status}*` : status;
                        }
                        row.appendChild(cell);
                    });
                    [
                        student.present,
                        student.late,
                        student.absent,
                        student.earlyDepartures,
                        `${student.attendancePercentage}%`
                    ].forEach(function (value) {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });
                    tbody.appendChild(row);
                });
                table.append(thead, tbody);
                tableContainer.appendChild(table);

                const mobileReport = createElement('div', { className: 'report-mobile' });
                mobileReport.appendChild(createElement('p', {
                    className: 'report-mobile-legend',
                    textContent: 'P: presente · A: ausente · T: tarde · R: retiro anticipado'
                }));
                report.students.forEach(function (student) {
                    const item = createElement('article', { className: 'attendance-mobile-item' });
                    const itemHeader = document.createElement('header');
                    itemHeader.appendChild(createElement('h4', {
                        textContent: `${student.surname}, ${student.name}`
                    }));
                    itemHeader.appendChild(createElement('span', {
                        className: 'percentage',
                        textContent: `${student.attendancePercentage}%`
                    }));
                    item.appendChild(itemHeader);

                    const totals = createElement('div', { className: 'mobile-attendance-statuses' });
                    [['Presentes', student.present], ['Tardes', student.late], ['Ausentes', student.absent], ['Retiros', student.earlyDepartures]]
                        .forEach(function (status) {
                            const total = createElement('div', { className: 'mobile-status' });
                            total.appendChild(createElement('span', { textContent: status[0] }));
                            total.appendChild(createElement('strong', { textContent: status[1] }));
                            totals.appendChild(total);
                        });
                    item.appendChild(totals);

                    const sessions = createElement('div', { className: 'mobile-session-list' });
                    report.sessions.forEach(function (session) {
                        const record = student.attendanceByDate[session.date];
                        const sessionItem = createElement('div', { className: 'mobile-session' });
                        sessionItem.appendChild(createElement('span', {
                            textContent: session.date.split('-').reverse().join('/')
                        }));
                        const status = record ? ({ present: 'P', late: 'T', absent: 'A' }[record.status] || '-') : '-';
                        sessionItem.appendChild(createElement('strong', {
                            textContent: record && record.earlyDeparture ? `${status}R` : status
                        }));
                        sessions.appendChild(sessionItem);
                    });
                    item.appendChild(sessions);
                    mobileReport.appendChild(item);
                });
                tableContainer.appendChild(mobileReport);
                reportCard.style.display = 'block';

            }

                            records
                        });
                        menu.printResult({ message: 'Asistencia guardada correctamente', ...result });
                    } catch (e) { alert(`Error: ${e.detail}`); }
                };

                const showAttendanceReport = async function () {
                    try {
                        const courses = await rpcFetch('/listCourses');
                        if (courses.length === 0) {
                            alert('No hay cursos disponibles.');
                            return;
                        }
                        const selection = await showFormModal('Consultar Asistencias', [
                            { name: 'courseId', label: 'Curso', type: 'select', options: courses.map(function (course) { return { value: course.courseId, text: course.name }; }) }
                        ]);
                        if (!selection) return;
                        const report = await rpcFetch('/getAttendanceReport', selection);
                        menu.printAttendanceReport(report);
                    } catch (e) { alert(`Error: ${e.detail}`); }
                };

                document.getElementById('btnAttendanceReport').onclick = showAttendanceReport;
                document.getElementById('btnTeacherAttendanceReport').onclick = showAttendanceReport;

                document.getElementById('btnNewStudent').onclick = async function () {
                    const data = await showFormModal('Nuevo Estudiante', [
                        { name: 'name', label: 'Nombre' },
                        { name: 'surname', label: 'Apellido' },
                        { name: 'dni', label: 'DNI', type: 'number' }
                    ]);
                    if (!data) return;
                    try {
                        const res = await rpcFetch('/newStudent', data);
                        menu.printResult(res);
                        alert('Estudiante registrado con éxito.');
                    } catch (e) { alert(`Error: ${e.detail}`); }
                };

            }
        }

        customElements.define('main-menu', Menu);

        function main() {
            document.body.appendChild(new Menu());
        }

        window.onload = main;
    </script>
</html>
